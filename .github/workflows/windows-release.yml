name: Windows Release Build

# Builds the DJ Set Recorder Windows installer (MSI + NSIS .exe) on a real
# Windows machine in the cloud, so no local build tools are needed.
#
# How to get your installer:
#   1. Connect this project to GitHub (Lovable -> GitHub -> Connect).
#   2. Push any change (or press "Run workflow" in the Actions tab).
#   3. Open the finished run in GitHub -> Actions and download the
#      "windows-installer" artifact at the bottom of the page.
#   Every successful build is also published as a versioned GitHub Release
#   (v<app-version>-build.<run-number>, or your tag name for v* tag pushes)
#   with the installer attached, under GitHub -> Releases.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Build the desktop installer
        run: bun run desktop:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Compute release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            APP_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
            TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: DJ Set Recorder ${{ steps.version.outputs.tag }}
          body: |
            Windows installer for DJ Set Recorder (build ${{ github.run_number }}).
            Download the .msi or .exe below and run it to install.
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
