name: Windows Release Build

# Builds NVRBEATS on Windows, signs release binaries with Microsoft Artifact Signing,
# packages MSI/NSIS installers, and publishes versioned GitHub Releases.
#
# Before non-PR runs can publish installers, configure the nvrbeats-signing GitHub
# environment and its Azure OIDC identity as documented in docs/MICROSOFT-STORE.md.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    # The signing environment gives Azure OIDC a stable subject for branch, tag,
    # and manual release runs. PR builds use an unprivileged environment and skip signing.
    environment:
      name: ${{ github.event_name == 'pull_request' && 'ci' || 'nvrbeats-signing' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: bun install

      - name: Validate Artifact Signing configuration
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT_NAME: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $required = @(
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID',
            'ARTIFACT_SIGNING_ENDPOINT',
            'ARTIFACT_SIGNING_ACCOUNT_NAME',
            'ARTIFACT_SIGNING_CERTIFICATE_PROFILE'
          )
          $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($missing.Count -gt 0) {
            throw "Configure the nvrbeats-signing GitHub environment before creating a release. Missing: $($missing -join ', '). See docs/MICROSOFT-STORE.md."
          }

      - name: Test installer validation
        run: bun test scripts/verify-windows-installers.test.mjs

      # Build the app first so its executable and native DLLs can be signed before Tauri embeds them.
      - name: Build the desktop app without installers
        run: bunx tauri build --no-bundle

      - name: Sign in to Azure with GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the NVRBEATS app executable and native DLLs
        if: github.event_name != 'pull_request'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release
          files-folder-filter: exe,dll
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: NVRBEATS Windows application
          description-url: https://github.com/sar365/NVRBEATS

      # --no-binary-patching preserves the app's signature after Tauri packages it.
      - name: Build MSI and NSIS installers
        run: bunx tauri bundle --no-binary-patching

      - name: Sign the MSI and NSIS installers
        if: github.event_name != 'pull_request'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\src-tauri\target\release\bundle
          files-folder-filter: msi,exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: NVRBEATS Windows installer
          description-url: https://github.com/sar365/NVRBEATS

      - name: Verify both Windows installers
        run: bun scripts/verify-windows-installers.mjs

      - name: Set up Microsoft WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Package Microsoft Store MSIX
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ vars.STORE_PACKAGE_NAME || 'NVRBEATS.Preview' }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER || 'CN=NVRBEATS Preview' }}
        run: ./scripts/package-microsoft-store.ps1

      - name: Explain preview package identity
        if: vars.STORE_PACKAGE_NAME == '' || vars.STORE_PUBLISHER == ''
        shell: pwsh
        run: Write-Host 'This is a preview MSIX, not ready for Store submission. Reserve the app name in Partner Center, then set STORE_PACKAGE_NAME and STORE_PUBLISHER repository variables. See docs/MICROSOFT-STORE.md.'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Microsoft Store package
        if: vars.STORE_PACKAGE_NAME != '' && vars.STORE_PUBLISHER != ''
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-msix
          path: dist/store/*.msix
          if-no-files-found: error

      - name: Upload Microsoft Store preview package
        if: vars.STORE_PACKAGE_NAME == '' || vars.STORE_PUBLISHER == ''
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-msix-preview
          path: dist/store/*.msix
          if-no-files-found: error

  publish-release:
    if: github.event_name != 'pull_request'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: installers

      - name: Compute release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            APP_VERSION=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
            TAG="v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: NVRBEATS ${{ steps.version.outputs.tag }}
          body: |
            Windows installer for NVRBEATS (build ${{ github.run_number }}).
            Download the signed .msi or .exe below and run it to install.
          files: |
            installers/msi/*.msi
            installers/nsis/*.exe
          fail_on_unmatched_files: true
